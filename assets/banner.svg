<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid / Wave Pattern -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for subtle neon glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatBeam {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes waveMotion {
        0% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(-8px) scaleY(1.08); }
        100% { transform: translateY(0px) scaleY(1); }
      }
      @keyframes barPulse1 {
        0%, 100% { height: 40px; y: 240px; }
        50% { height: 90px; y: 190px; }
      }
      @keyframes barPulse2 {
        0%, 100% { height: 80px; y: 200px; }
        50% { height: 130px; y: 150px; }
      }
      @keyframes barPulse3 {
        0%, 100% { height: 60px; y: 220px; }
        50% { height: 110px; y: 170px; }
      }
      @keyframes barPulse4 {
        0%, 100% { height: 100px; y: 180px; }
        50% { height: 50px; y: 230px; }
      }
      .grid-layer {
        animation: pulseGrid 4s ease-in-out infinite;
      }
      .laser-beam {
        animation: floatBeam 6s linear infinite;
      }
      .wave-line {
        animation: waveMotion 5s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .bar-1 { animation: barPulse1 3.2s ease-in-out infinite; }
      .bar-2 { animation: barPulse2 2.7s ease-in-out infinite; }
      .bar-3 { animation: barPulse3 3.6s ease-in-out infinite; }
      .bar-4 { animation: barPulse4 2.9s ease-in-out infinite; }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Ambient Grid Pattern (Background) -->
  <g class="grid-layer" stroke="#334155" stroke-width="0.75" opacity="0.2">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="720" y1="0" x2="720" y2="340" />
    <line x1="840" y1="0" x2="840" y2="340" />
    <line x1="960" y1="0" x2="960" y2="340" />
    <line x1="1080" y1="0" x2="1080" y2="340" />
  </g>

  <!-- Background Dynamic Benchmark Histogram / Bars (Positioned away from text) -->
  <g opacity="0.25">
    <rect class="bar-1" x="980" width="22" rx="4" fill="#38bdf8" />
    <rect class="bar-2" x="1015" width="22" rx="4" fill="#818cf8" />
    <rect class="bar-3" x="1050" width="22" rx="4" fill="#a855f7" />
    <rect class="bar-4" x="1085" width="22" rx="4" fill="#ec4899" />
    <rect class="bar-2" x="1120" width="22" rx="4" fill="#06b6d4" />
  </g>

  <!-- Animated Throughput Sine Curve in Background -->
  <g class="wave-line">
    <path d="M 0 280 Q 200 230, 400 275 T 800 260 T 1200 270" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" opacity="0.4" filter="url(#neon-glow)" />
    <path d="M 0 280 L 1200 280" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,6" />
  </g>

  <!-- Dynamic Laser Sweep Across Grid -->
  <rect class="laser-beam" y="0" width="280" height="340" fill="url(#wave-grad)" />

  <!-- Foreground Content: Unobstructed, high contrast -->
  <g transform="translate(60, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19" fill="#38bdf8" class="badge-text" letter-spacing="1">⚡ HIGH-THROUGHPUT LOAD TESTING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" class="title-text" font-size="44">Awesome HTTP Benchmarking</text>

    <!-- Gradient Underline Accent -->
    <rect x="0" y="162" width="540" height="4" rx="2" fill="url(#primary-glow)" />

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="205" fill="#94a3b8" class="subtitle-text" font-size="19">
      Curated Ecosystem of SaaS Platforms &amp; High-Concurrency Open-Source Load Generators
    </text>

    <!-- Metric Tags / Feature Badges -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Concurrency -->
      <g>
        <rect width="135" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="18" fill="#cbd5e1" class="badge-text">🚀 High Concurrency</text>
      </g>
      <!-- Badge 2: Latency -->
      <g transform="translate(145, 0)">
        <rect width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="18" fill="#cbd5e1" class="badge-text">⏱️ Low-Latency RPS</text>
      </g>
      <!-- Badge 3: Distributed -->
      <g transform="translate(285, 0)">
        <rect width="145" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="18" fill="#cbd5e1" class="badge-text">🌐 Cloud &amp; Distributed</text>
      </g>
      <!-- Badge 4: Open Source -->
      <g transform="translate(440, 0)">
        <rect width="135" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="18" fill="#cbd5e1" class="badge-text">🔓 Open Source Core</text>
      </g>
    </g>
  </g>
</svg>
